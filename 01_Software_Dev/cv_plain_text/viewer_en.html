            border-radius: 6px;

                color: black !important;

                line-height: 1.4 !important;

        /**
         * Carga los datos maestros desde bundle.js o fetch HTTP y desencadena el renderizado.
         */
        async function loadData() {
            updateLangButton();
            try {
                const bundle = window.CV_DATA;
                const langSource = (currentLang === 'en' && bundle?.en) ? bundle.en : (bundle?.es || bundle);

                let profileData = langSource?.profile_software;
                let projectsData = langSource?.projects || [];
                let certsData = langSource?.certifications || [];

                if (profileData) {
                    renderText(generateAtsString(profileData, projectsData, certsData, currentLang));
                } else {
                    renderText(ATS_FALLBACK);
                }

                // Intentar refresco vía fetch si se ejecuta sobre servidor HTTP
                const suffix = currentLang === 'en' ? '_en' : '';
                try {
                    const [resProf, resProj, resCerts] = await Promise.allSettled([
                        fetch(`../../data/profile_software${suffix}.json`).then(r => r.ok ? r.json() : Promise.reject()),
                        fetch(`../../data/projects${suffix}.json`).then(r => r.ok ? r.json() : Promise.reject()),
                        fetch(`../../data/certifications${suffix}.json`).then(r => r.ok ? r.json() : Promise.reject())
                    ]);

                    if (resProf.status === 'fulfilled' && resProf.value) {
                        profileData = resProf.value;
                        if (resProj.status === 'fulfilled' && resProj.value) projectsData = resProj.value.projects;
                        if (resCerts.status === 'fulfilled' && resCerts.value) certsData = resCerts.value.certifications;
                        renderText(generateAtsString(profileData, projectsData, certsData, currentLang));
                    }
                } catch (_) {}
            } catch (err) {
                console.warn('Error al procesar datos estructurados para ATS, aplicando fallback:', err);
                renderText(ATS_FALLBACK);
            }
        }

${(data.soft_skills || []).join(' • ')}

[ IDIOMAS ]
------------------------------------------------------------------------------
${(data.languages || []).map(l => `* ${l.language}: ${l.level} ${l.certification ? `(${l.certification})` : ''}`).join('\n')}

 Fin del documento — Generado Dinámicamente desde /data/
==============================================================================`;
        }

        /**
         * Renderiza el texto en el pre e indexa los números de línea.
         * 
         * @param {string} text Texto formateado a mostrar.
         */
        function renderText(text) {
            const pre = document.getElementById('plainTextContent');
            if (pre) pre.textContent = text;

            const lines = (text || '').split('\n');
            const numContainer = document.getElementById('lineNumbers');
            if (numContainer) numContainer.innerHTML = lines.map((_, i) => i + 1).join('<br>');
        }

        /**
         * Copia el contenido plano al portapapeles con feedback tipo toast.
         */
        function copyToClipboard() {
            const text = document.getElementById('plainTextContent').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                if (toast) {
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2500);
                }
            });
        }

        /**
         * Alterna la visibilidad de los números de línea.
         */
        function toggleLineNumbers() {
            showLines = !showLines;
            const el = document.getElementById('lineNumbers');
            if (el) el.classList.toggle('hidden', !showLines);
        }

        /**
         * Alterna el tema claro y oscuro.
         */
        function toggleTheme() {
            document.body.classList.toggle('theme-light');
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
